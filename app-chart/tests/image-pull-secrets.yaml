esm:
  SimpleSecrets:
    - name: ghcr-pull-secret
      dataSecretKey: .dockerconfigjson
      remoteRefKey: /k8s-prod/pull-secrets/ghcr
    - name: app-specific-secret
      dataSecretKey: .dockerconfigjson
      remoteRefKey: /k8s-prod/pull-secrets/app-specific

imagePullSecrets:
  - ghcr-pull-secret
  - pre-existing-secret

apps:
  private-app:
    image:
      repository: ghcr.io/my-org/private-app
      tag: "v1.0.0"
    imagePullSecret:
      - app-specific-secret

cronJobs:
  private-sync:
    schedule: "0 * * * *"
    container:
      image:
        repository: ghcr.io/my-org/sync
        tag: "latest"
