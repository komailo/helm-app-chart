imagePullSecrets:
  ghcr-pull-secret:
    remoteRefKey: /k8s-prod/pull-secrets/ghcr
  existing-pull-secret:
    name: pre-existing-secret

apps:
  private-app:
    image:
      repository: ghcr.io/my-org/private-app
      tag: "v1.0.0"
    imagePullSecrets:
      - name: app-specific-secret
        remoteRefKey: /k8s-prod/pull-secrets/app-specific

cronJobs:
  private-sync:
    schedule: "0 * * * *"
    container:
      image:
        repository: ghcr.io/my-org/sync
        tag: "latest"
